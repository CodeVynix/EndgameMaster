name: iOS IPA Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        run: xcodegen generate

      - name: Archive app
        run: |
          xcodebuild \
            -project EndgameMaster.xcodeproj \
            -scheme EndgameMaster \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/EndgameMaster.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            archive

      - name: Create IPA (manual, unsigned)
        run: |
          mkdir -p Payload

          APP_PATH=$(find build/EndgameMaster.xcarchive -name "*.app" -type d | head -n 1)

          echo "App found at: $APP_PATH"

          cp -r "$APP_PATH" Payload/

          zip -r EndgameMaster.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: EndgameMaster.ipa
          path: EndgameMaster.ipa

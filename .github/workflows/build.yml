name: iOS Build

on:
push:
branches: [ main ]
workflow_dispatch:

jobs:
build:
runs-on: macos-latest

```
steps:
  - name: Checkout repo
    uses: actions/checkout@v4

  - name: Select Xcode
    run: sudo xcode-select -s /Applications/Xcode.app

  - name: Install XcodeGen
    run: brew install xcodegen

  - name: Clean DerivedData
    run: rm -rf ~/Library/Developer/Xcode/DerivedData

  # 🔥 Build Stockfish for iOS (arm64)
  - name: Build Stockfish
    run: |
      git clone https://github.com/official-stockfish/Stockfish.git
      cd Stockfish/src

      SDK=$(xcrun --sdk iphoneos --show-sdk-path)

      clang++ -std=c++17 -O3 -arch arm64 -isysroot $SDK -c *.cpp

      cd ../../
      mkdir -p Engine

      # ⚠️ ONLY include wrapper.cpp (NOT wrapper.mm)
      clang++ -std=c++17 -O3 -arch arm64 \
        -isysroot $SDK \
        -c Engine/stockfish_wrapper.cpp \
        -o Engine/stockfish_wrapper.o

      ar rcs Engine/libstockfish.a Stockfish/src/*.o Engine/stockfish_wrapper.o

  # 🔧 Generate Xcode project
  - name: Generate project
    run: xcodegen generate

  # 📦 Build app (no signing)
  - name: Build app
    run: |
      xcodebuild \
        -project EndgameMaster.xcodeproj \
        -scheme EndgameMaster \
        -destination 'generic/platform=iOS' \
        -configuration Release \
        CODE_SIGNING_ALLOWED=NO \
        build

  # 📤 Upload build artifact
  - name: Upload app
    uses: actions/upload-artifact@v4
    with:
      name: EndgameMaster.app
      path: build/Release-iphoneos/EndgameMaster.app
```

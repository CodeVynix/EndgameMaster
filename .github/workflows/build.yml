name: iOS IPA Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Build Stockfish
        run: |
          git clone https://github.com/official-stockfish/Stockfish.git
          cd Stockfish/src

          SDK=$(xcrun --sdk iphoneos --show-sdk-path)

          clang++ -std=c++17 -O3 -arch arm64 -isysroot $SDK -c *.cpp

          cd ../../
          mkdir -p Engine

          clang++ -std=c++17 -O3 -arch arm64 \
            -isysroot $SDK \
            -c Engine/stockfish_wrapper.cpp \
            -o Engine/stockfish_wrapper.o

          ar rcs Engine/libstockfish.a Stockfish/src/*.o Engine/stockfish_wrapper.o

      - name: Generate project
        run: xcodegen generate

      - name: Archive app
        run: |
          xcodebuild \
            -project EndgameMaster.xcodeproj \
            -scheme EndgameMaster \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/EndgameMaster.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            archive

      - name: Export IPA (unsigned)
         run: |
    mkdir -p build/export

    cat > exportOptions.plist <<EOF
    <?xml version="1.0" encoding="UTF-8"?>
    <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
    <plist version="1.0">
    <dict>
        <key>method</key>
        <string>development</string>
        <key>signingStyle</key>
        <string>manual</string>
        <key>compileBitcode</key>
        <false/>
    </dict>
    </plist>
    EOF

    xcodebuild -exportArchive \
      -archivePath build/EndgameMaster.xcarchive \
      -exportPath build/export \
      -exportOptionsPlist exportOptions.plist

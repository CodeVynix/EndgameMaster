name: iOS Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Clean DerivedData
        run: rm -rf ~/Library/Developer/Xcode/DerivedData

      - name: Build Stockfish (iOS ARM64)
        run: |
          git clone https://github.com/official-stockfish/Stockfish.git
          cd Stockfish/src

          SDK=$(xcrun --sdk iphoneos --show-sdk-path)

          # Compile Stockfish
          clang++ -std=c++17 -O3 -arch arm64 -isysroot $SDK -c *.cpp

          cd ../../

          # Compile wrapper (IMPORTANT)
          clang++ -std=c++17 -O3 -arch arm64 \
            -isysroot $SDK \
            -c Engine/stockfish_wrapper.cpp \
            -o Engine/stockfish_wrapper.o

          # Create static library
          ar rcs Engine/libstockfish.a Stockfish/src/*.o Engine/stockfish_wrapper.o

      - name: Generate project
        run: xcodegen generate

      - name: Archive app
  run: |
    xcodebuild \
      -project EndgameMaster.xcodeproj \
      -scheme EndgameMaster \
      -destination 'generic/platform=iOS' \
      -configuration Release \
      -archivePath build/EndgameMaster.xcarchive \
      CODE_SIGNING_ALLOWED=NO \
      archive

- name: Export IPA
  run: |
    mkdir -p build/export

    cat <<EOF > build/exportOptions.plist
    <?xml version="1.0" encoding="UTF-8"?>
    <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
    <plist version="1.0">
    <dict>
        <key>method</key>
        <string>development</string>
        <key>signingStyle</key>
        <string>automatic</string>
    </dict>
    </plist>
    EOF

    xcodebuild -exportArchive \
      -archivePath build/EndgameMaster.xcarchive \
      -exportOptionsPlist build/exportOptions.plist \
      -exportPath build/export

- name: Upload IPA
  uses: actions/upload-artifact@v4
  with:
    name: EndgameMaster-IPA
    path: build/export/*.ipa

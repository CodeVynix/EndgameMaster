name: EndgameMaster

options:
  bundleIdPrefix: com.codevynix

targets:
  EndgameMaster:
    type: application
    platform: iOS
    deploymentTarget: "15.0"

    sources:
      - path: .
        excludes:
          - .git
          - .github
          - build
          - Stockfish

    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.codevynix.endgamemaster
        INFOPLIST_FILE: Info.plist
        SWIFT_VERSION: 5.0
